name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm --workspace @nomad/engine test

  api:
    name: API (Postgres + BullMQ)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: nomad, POSTGRES_PASSWORD: nomad, POSTGRES_DB: nomad }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nomad" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://nomad:nomad@localhost:5432/nomad
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx turbo run build --filter=@nomad/api...
      - run: npm --workspace @nomad/api test

  ml:
    name: ML service
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/ml }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: services/ml/requirements.txt }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -r requirements.txt
      - run: pytest -q

  recall-gate:
    name: Exploration quality gate
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx turbo run build --filter=@nomad/engine...
      - name: Start the seeded target
        run: |
          node targets/buggy-shop/server.js &
          npx wait-on -t 30000 http://localhost:4100
      - name: Explore and score
        # Fails the build if any rule-detectable planted bug is missed or a false positive appears.
        run: >
          node packages/engine/dist/cli/nomad.js scan http://localhost:4100
          --steps 45 --out runs --run-id ci
          --manifest targets/buggy-shop/bugs.manifest.json
          --min-recall 1 --min-precision 1
      - name: Replay the generated tests on the fixed build
        run: |
          PORT=4102 BUGS=off node targets/buggy-shop/server.js &
          npx wait-on -t 30000 http://localhost:4102
          node packages/engine/dist/cli/nomad.js sweep runs/ci http://localhost:4102
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ci-run, path: runs/ci, retention-days: 7 }

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx turbo run build --filter=@nomad/web...
